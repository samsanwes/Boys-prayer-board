<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boys Prayer Board</title>
<meta property="og:title" content="Boys Prayer Board">
<meta property="og:description" content="Wednesday Bible Study prayer board. Add your thanksgiving or prayer point for this week.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://boys-prayer-board.vercel.app/">
<meta property="og:image" content="https://boys-prayer-board.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="description" content="Wednesday Bible Study prayer board. Add your thanksgiving or prayer point for this week.">
<style>
:root{--ink:#0b1f5c;--soft:#4a5a85;--bg:#e3eaf7;--card:#ffffff;--gold:#1e4fa8;--green:#2e7d4f;--red:#a33;--line:#c9d7ef;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.55;padding-bottom:60px;}
header{background:var(--card);border-bottom:1px solid var(--line);padding:28px 20px 22px;text-align:center;}
header h1{font-size:30px;font-weight:normal;}
header p{color:var(--soft);font-size:17px;margin-top:6px;}
main{max-width:620px;margin:0 auto;padding:20px 16px;}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:26px;}
.box label{display:block;font-size:16px;color:var(--soft);margin-bottom:5px;}
input,textarea,select{width:100%;font-family:inherit;font-size:19px;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;background:#f6f9fe;color:var(--ink);}
textarea{min-height:80px;resize:vertical;}
.btn{display:inline-block;font-family:inherit;font-size:19px;padding:13px 26px;border:none;border-radius:8px;background:var(--ink);color:#fff;cursor:pointer;}
h2{font-size:22px;font-weight:normal;margin:26px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--gold);}
h3{font-size:19px;font-weight:normal;color:var(--soft);margin:18px 0 10px;}
.prayer{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
.prayer .point{font-size:20px;font-weight:bold;margin-bottom:2px;}
.prayer .meta{font-size:15px;color:var(--soft);margin-bottom:6px;}
.prayer .text{font-size:19px;}
.actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.small-btn{font-family:inherit;font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#f6f9fe;color:var(--ink);cursor:pointer;}
.small-btn.answer{border-color:var(--green);color:var(--green);}
.small-btn.danger{border-color:var(--red);color:var(--red);}
.small-btn.move{padding:8px 14px;font-size:18px;line-height:1;}
.small-btn:disabled{opacity:0.35;cursor:default;}
.answered .text{color:var(--soft);}
.answered-tag{color:var(--green);font-size:15px;}
.empty{color:var(--soft);font-style:italic;padding:10px 4px;}
.status{text-align:center;color:var(--soft);font-size:15px;margin-top:8px;min-height:20px;}
#listView{display:none;position:fixed;inset:0;background:var(--card);overflow-y:auto;z-index:10;padding:24px 18px 80px;}
.mpoint{font-size:22px;line-height:1.4;margin-bottom:2px;font-weight:bold;}
.mdetail{font-size:19px;color:var(--ink);margin-bottom:4px;}
.mby{font-size:15px;color:var(--soft);margin-bottom:18px;}
</style>
</head>
<body>
<header>
<h1>Boys Prayer Board</h1>
<p>Wednesday Bible Study</p>
<button class="btn" style="margin-top:14px;" onclick="showList()">This week's prayer list</button>
</header>
<main>
<div class="box">
<h2 style="margin-top:0;">Add a prayer request</h2>
<label for="ppoint">Prayer point (who or what this is for)</label>
<input type="text" id="ppoint" placeholder="e.g. Roshan's Health">
<label for="ptext">Prayer request</label>
<textarea id="ptext" placeholder="What shall we pray for?"></textarea>
<label for="pcat">This is for</label>
<select id="pcat"><option>Personal</option><option>Family</option><option>Friends</option><option>Nation</option><option>World</option><option>Thanksgiving</option></select>
<label for="pby">Your name</label>
<input type="text" id="pby" placeholder="e.g. Roshan">
<button class="btn" onclick="addPrayer()">Add to the board</button>
<div class="status" id="status"></div>
</div>

<div class="box" style="text-align:center;">
<p style="color:var(--soft);font-size:17px;margin-bottom:12px;">Need to edit, reorder, mark a prayer answered or remove one?</p>
<a class="btn" href="/manage" style="text-decoration:none;">Manage the board</a>
</div>
</main>

<div id="listView">
<div style="max-width:640px;margin:0 auto;">
<button class="small-btn" onclick="hideList()">Back to board</button>
<button class="small-btn" style="float:right;" onclick="copyList()">Copy list</button>
<div id="listCopyStatus" style="clear:both;text-align:center;color:var(--green);font-size:16px;min-height:20px;"></div>
<h1 style="font-size:32px;font-weight:normal;margin:20px 0 4px;text-align:center;">This Week's Prayer List</h1>
<p id="listDate" style="text-align:center;color:var(--soft);font-size:18px;margin-bottom:24px;"></p>
<div id="listBody"><div class="empty">Loading...</div></div>
</div>
</div>
<script>var BOARD={"table": "prayers_ws", "cats": ["Personal", "Family", "Friends", "Nation", "World", "Thanksgiving"], "addedMsg": "Added to the board. It will appear in this week's prayer list.", "waHeader": "Boys Prayer Board - This Week's Prayer List", "backupHeader": "BOYS PRAYER BOARD", "nameRequired": true, "showAddedBy": true};</script>
<script src="/board.js"></script>
</body>
</html>
