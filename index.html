<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boys Prayer Board</title>
<style>
:root{--ink:#2b3348;--soft:#6b7386;--bg:#f2f4f7;--card:#ffffff;--gold:#b8860b;--green:#2e7d4f;--line:#dde2ea;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.55;padding-bottom:60px;}
header{background:var(--card);border-bottom:1px solid var(--line);padding:28px 20px 22px;text-align:center;}
header h1{font-size:30px;font-weight:normal;}
header p{color:var(--soft);font-size:17px;margin-top:6px;font-style:italic;}
main{max-width:620px;margin:0 auto;padding:20px 16px;}
.add-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:26px;}
.add-box label{display:block;font-size:16px;color:var(--soft);margin-bottom:5px;}
.add-box input,.add-box textarea,.add-box select{width:100%;box-sizing:border-box;font-family:inherit;font-size:19px;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;background:#fbfcfe;color:var(--ink);}
.add-box textarea{min-height:80px;resize:vertical;}
.btn{display:inline-block;font-family:inherit;font-size:19px;padding:13px 26px;border:none;border-radius:8px;background:var(--ink);color:#fff;cursor:pointer;}
h2{font-size:22px;font-weight:normal;margin:26px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--gold);}
.small-btn{font-family:inherit;font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fbfcfe;color:var(--ink);cursor:pointer;}
.empty{color:var(--soft);font-style:italic;padding:10px 4px;}
.status{text-align:center;color:var(--soft);font-size:15px;margin-top:8px;min-height:20px;}
#weekView{display:none;position:fixed;inset:0;background:var(--card);overflow-y:auto;z-index:10;padding:24px 18px 80px;}
.mpoint{font-size:22px;line-height:1.4;margin-bottom:2px;font-weight:bold;}
.mdetail{font-size:19px;color:var(--ink);margin-bottom:4px;}
.mby{font-size:15px;color:var(--soft);margin-bottom:18px;}
</style>
</head>
<body>
<header>
<h1>Boys Prayer Board</h1>
<p style="font-style:normal;margin-top:2px;">Wednesday Bible Study</p>
<button class="btn" style="margin-top:14px;" onclick="showWeek()">This week's prayer list</button>
</header>
<main>
<div class="add-box">
<h2 style="margin-top:0;">Add a prayer request</h2>
<label for="ppoint">Prayer point (who or what this is for)</label>
<input type="text" id="ppoint" placeholder="e.g. Roshan's Health">
<label for="ptext">Prayer request</label>
<textarea id="ptext" placeholder="What shall we pray for?"></textarea>
<label for="pcat">This is for</label>
<select id="pcat"><option>Personal</option><option>Family</option><option>Friends</option><option>Nation</option><option>World</option><option>Thanksgiving</option></select>
<label for="pby">Your name</label>
<input type="text" id="pby" placeholder="e.g. Roshan">
<button class="btn" onclick="addPrayer()">Add to the board</button>
<div class="status" id="status"></div>
</div>
<p style="color:var(--soft);font-size:17px;text-align:center;">All requests appear in <a href="#" onclick="showWeek();return false;" style="color:var(--ink);">this week's prayer list</a>.</p>
</main>
<div id="weekView">
<div style="max-width:640px;margin:0 auto;">
<button class="small-btn" onclick="hideWeek()">Back to board</button>
<button class="small-btn" style="float:right;" onclick="copyWeek()">Copy list</button>
<div id="weekCopyStatus" style="clear:both;text-align:center;color:var(--green);font-size:16px;min-height:20px;"></div>
<h1 style="font-size:32px;font-weight:normal;margin:20px 0 4px;text-align:center;">This Week's Prayer List</h1>
<p id="weekDate" style="text-align:center;color:var(--soft);font-size:18px;margin-bottom:24px;"></p>
<div id="weekList"><div class="empty">Loading...</div></div>
</div>
</div>
<script>
var SB_URL='https://irujnmfbefjpztovqwjx.supabase.co';
var SB_KEY='sb_publishable_31eIEGWomuVnjU2qnjTdDw_DDlS8K-M';
var HEADERS={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
var prayers=[];
async function api(method,query,body){
var opts={method:method,headers:HEADERS};
if(body){opts.body=JSON.stringify(body);}
var r=await fetch(SB_URL+'/rest/v1/prayers_ws'+query,opts);
if(!r.ok){throw new Error('request failed');}
return r;
}
async function load(){
var r=await api('GET','?select=*&order=sort_order.desc');
prayers=await r.json();
}
function setStatus(id,msg){
var s=document.getElementById(id);s.textContent=msg;
setTimeout(function(){s.textContent='';},5000);
}
function fmtDate(iso){return new Date(iso).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
function esc(t){var d=document.createElement('div');d.textContent=t||'';return d.innerHTML;}
async function addPrayer(){
var point=document.getElementById('ppoint').value.trim();
var text=document.getElementById('ptext').value.trim();
var cat=document.getElementById('pcat').value;
var by=document.getElementById('pby').value.trim();
if(!point){setStatus('status','Please write the prayer point first.');return;}
if(!text){setStatus('status','Please write the prayer request.');return;}
if(!by){setStatus('status','Please add your name.');return;}
try{
await api('POST','',{name:point,text:text,category:cat,added_by:by});
document.getElementById('ppoint').value='';
document.getElementById('ptext').value='';
document.getElementById('pby').value='';
setStatus('status','Added to the board. It will appear in this week\'s prayer list.');
}catch(e){setStatus('status','Could not save. Please try again.');}
}
function buildWeek(){
var active=prayers.filter(function(p){return !p.answered;});
var thanks=prayers.filter(function(p){return p.answered;}).concat(active.filter(function(p){return p.category==='Thanksgiving';}));
var seen={};thanks=thanks.filter(function(p){if(seen[p.id]){return false;}seen[p.id]=true;return true;});
return {active:active.filter(function(p){return p.category!=='Thanksgiving';}),thanks:thanks,order:['Personal','Family','Friends','Nation','World']};
}
function entryHtml(p,answered){
var by=p.added_by?'<div class="mby">Added by '+esc(p.added_by)+'</div>':'<div class="mby"></div>';
var mark=answered?'&#128591; ':'';
var ans=answered&&p.answered_date?' <span style="color:var(--green);font-size:16px;font-weight:normal;">(answered '+fmtDate(p.answered_date)+')</span>':'';
return '<div class="mpoint">'+mark+esc(p.name)+ans+'</div><div class="mdetail">'+esc(p.text)+'</div>'+by;
}
async function showWeek(){
document.getElementById('weekView').style.display='block';
window.scrollTo(0,0);
document.getElementById('weekDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
try{await load();}catch(e){document.getElementById('weekList').innerHTML='<div class="empty">Could not load the list. Check your internet and try again.</div>';return;}
var b=buildWeek();
var html='';
if(b.thanks.length){html+='<h2>Thanksgiving</h2>';
b.thanks.forEach(function(p){html+=entryHtml(p,p.answered);});}
b.order.forEach(function(cat){
var items=b.active.filter(function(p){return p.category===cat;});
if(!items.length){return;}
html+='<h2>'+cat+'</h2>';
items.forEach(function(p){html+=entryHtml(p,false);});
});
if(!html){html='<p class="empty">No requests on the board yet.</p>';}
document.getElementById('weekList').innerHTML=html;
}
function hideWeek(){document.getElementById('weekView').style.display='none';}
function copyWeek(){
var b=buildWeek();
var dateStr=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
var out='\uD83D\uDE4F *Boys Prayer Board - This Week\'s Prayer List*\n'+dateStr+'\n\n';
if(b.thanks.length){out+='*Thanksgiving*\n';
b.thanks.forEach(function(p){out+='\uD83D\uDE4F *'+p.name+'*\n'+p.text+'\n\n';});}
b.order.forEach(function(cat){
var items=b.active.filter(function(p){return p.category===cat;});
if(!items.length){return;}
out+='*'+cat+'*\n';
items.forEach(function(p){out+='- *'+p.name+'*\n'+p.text+'\n\n';});
});
if(!b.thanks.length&&!b.active.length){out+='No requests on the board yet.\n';}
navigator.clipboard.writeText(out).then(function(){setStatus('weekCopyStatus','Copied! Paste it into WhatsApp or any chat.');})
.catch(function(){setStatus('weekCopyStatus','Could not copy automatically. Please screenshot the list instead.');});
}
</script>
</body>
</html>
