<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keeper Admin - Big Family Prayer Board</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#2b3348;--soft:#6b7386;--bg:#f2f4f7;--card:#ffffff;--gold:#b8860b;--green:#2e7d4f;--red:#a33;--line:#dde2ea;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.55;padding-bottom:60px;}
header{background:var(--card);border-bottom:1px solid var(--line);padding:24px 20px;text-align:center;}
header h1{font-size:26px;font-weight:normal;}
header p{color:var(--soft);font-size:16px;margin-top:4px;}
main{max-width:620px;margin:0 auto;padding:20px 16px;}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:26px;}
input,textarea{width:100%;font-family:inherit;font-size:19px;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;background:#fbfcfe;color:var(--ink);}
.btn{display:inline-block;font-family:inherit;font-size:19px;padding:13px 26px;border:none;border-radius:8px;background:var(--ink);color:#fff;cursor:pointer;}
h2{font-size:22px;font-weight:normal;margin:26px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--gold);}
.prayer{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
.prayer .point{font-size:20px;font-weight:bold;margin-bottom:2px;}
.prayer .meta{font-size:15px;color:var(--soft);margin-bottom:6px;}
.prayer .text{font-size:19px;}
.actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;}
.small-btn{font-family:inherit;font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fbfcfe;color:var(--ink);cursor:pointer;}
.small-btn.answer{border-color:var(--green);color:var(--green);}
.small-btn.danger{border-color:var(--red);color:var(--red);}
.answered .text{color:var(--soft);}
.answered-tag{color:var(--green);font-size:15px;}
.tag{display:inline-block;font-size:14px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--soft);margin-left:6px;}
.empty{color:var(--soft);font-style:italic;padding:10px 4px;}
.status{text-align:center;color:var(--soft);font-size:15px;margin-top:8px;min-height:20px;}
</style>
</head>
<body>
<header>
<h1>Keeper Admin</h1>
<p>Big Family Prayer Board - manage requests</p>
</header>
<main>
<div class="box" id="loginBox">
<p style="margin-bottom:12px;">Enter the keeper passcode to manage the board.</p>
<input type="password" id="passInput" placeholder="Keeper passcode">
<button class="btn" onclick="login()">Sign in</button>
<div class="status" id="loginStatus"></div>
</div>
<div id="adminArea" style="display:none">
<div class="status" id="status"></div>
<h2>Praying for</h2>
<div id="activeList"><div class="empty">Loading...</div></div>
<h2>Thanksgiving (answered)</h2>
<div id="answeredList"></div>
<h2>Backup</h2>
<p style="color:var(--soft);font-size:17px;margin-bottom:12px;">Copy the whole board as plain text, then paste it into an email or note to keep it safe.</p>
<button class="btn" onclick="exportBoard()">Copy board for backup</button>
<div class="status" id="exportStatus"></div>
<textarea id="exportText" style="display:none;min-height:200px;font-size:16px;margin-top:12px;" readonly></textarea>
<p style="margin-top:24px;"><button class="small-btn" onclick="logout()">Sign out</button> <a href="/" style="color:var(--soft);font-size:16px;margin-left:10px;">Back to the board</a></p>
</div>
</main>
<script>
var SB_URL='https://irujnmfbefjpztovqwjx.supabase.co';
var SB_KEY='sb_publishable_31eIEGWomuVnjU2qnjTdDw_DDlS8K-M';
var HEADERS={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
var prayers=[];var editingId=null;var PASS='';
async function rpc(name,body){
var r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:HEADERS,body:JSON.stringify(body)});
if(!r.ok){throw new Error('rpc failed');}
return r;
}
async function login(){
var p=document.getElementById('passInput').value;
if(!p){return;}
try{
var r=await rpc('admin_check',{pass:p});
var ok=await r.json();
if(ok===true){PASS=p;sessionStorage.setItem('keeperPass',p);showAdmin();}
else{setStatus('loginStatus','Incorrect passcode.');}
}catch(e){setStatus('loginStatus','Could not check the passcode. Try again.');}
}
function logout(){PASS='';sessionStorage.removeItem('keeperPass');location.reload();}
function showAdmin(){
document.getElementById('loginBox').style.display='none';
document.getElementById('adminArea').style.display='block';
load();
}
async function load(){
try{
var r=await fetch(SB_URL+'/rest/v1/prayers?select=*&order=created_at.desc',{headers:HEADERS});
prayers=await r.json();
}catch(e){
document.getElementById('activeList').innerHTML='<div class="empty">Could not load. Refresh the page.</div>';
return;
}
render();
}
function setStatus(id,msg){
var s=document.getElementById(id);s.textContent=msg;
setTimeout(function(){s.textContent='';},5000);
}
function fmtDate(iso){return new Date(iso).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
function esc(t){var d=document.createElement('div');d.textContent=t||'';return d.innerHTML;}
function metaLine(p){
var by=p.added_by?esc(p.added_by)+' &middot; ':'';
var upd=p.edited?' &middot; updated '+fmtDate(p.edited):'';
return '<div class="meta">'+by+fmtDate(p.created_at)+upd+'<span class="tag">'+esc(p.category)+'</span></div>';
}
function render(){
var active=prayers.filter(function(p){return !p.answered;});
var done=prayers.filter(function(p){return p.answered;});
var al=document.getElementById('activeList');
if(active.length===0){al.innerHTML='<div class="empty">No active requests.</div>';}
else{
al.innerHTML=active.map(function(p){
if(p.id===editingId){
return '<div class="prayer">'+metaLine(p)+'<input id="editPoint" value="'+esc(p.name)+'"><textarea id="editArea">'+esc(p.text)+'</textarea><div class="actions"><button class="small-btn answer" onclick="saveEdit(\''+p.id+'\')">Save changes</button><button class="small-btn" onclick="cancelEdit()">Cancel</button></div></div>';
}
return '<div class="prayer"><div class="point">'+esc(p.name)+'</div>'+metaLine(p)+'<div class="text">'+esc(p.text)+'</div><div class="actions"><button class="small-btn answer" onclick="markAnswered(\''+p.id+'\')">Prayer answered</button><button class="small-btn" onclick="startEdit(\''+p.id+'\')">Edit</button><button class="small-btn danger" onclick="removePrayer(\''+p.id+'\')">Remove</button></div></div>';
}).join('');
}
var dl=document.getElementById('answeredList');
if(done.length===0){dl.innerHTML='<div class="empty">No answered prayers yet.</div>';}
else{
dl.innerHTML=done.map(function(p){
return '<div class="prayer answered"><div class="point">&#128591; '+esc(p.name)+'</div>'+metaLine(p)+'<div class="text">'+esc(p.text)+'</div><div class="answered-tag">Answered '+(p.answered_date?fmtDate(p.answered_date):'')+'</div><div class="actions"><button class="small-btn danger" onclick="removePrayer(\''+p.id+'\')">Remove</button></div></div>';
}).join('');
}
}
async function markAnswered(id){
try{await rpc('admin_answered',{pass:PASS,pid:id});await load();setStatus('status','Moved to Thanksgiving.');}
catch(e){setStatus('status','Could not update. Check the passcode or try again.');}
}
function startEdit(id){editingId=id;render();var t=document.getElementById('editPoint');if(t){t.focus();}}
function cancelEdit(){editingId=null;render();}
async function saveEdit(id){
var pt=document.getElementById('editPoint');
var t=document.getElementById('editArea');
var np=pt?pt.value.trim():'';
var v=t?t.value.trim():'';
if(!np||!v){return;}
try{await rpc('admin_edit2',{pass:PASS,pid:id,newpoint:np,newtext:v});editingId=null;await load();setStatus('status','Saved.');}
catch(e){setStatus('status','Could not save the edit. Try again.');}
}
async function removePrayer(id){
if(!confirm('Remove this point permanently?')){return;}
try{await rpc('admin_delete',{pass:PASS,pid:id});await load();setStatus('status','Removed.');}
catch(e){setStatus('status','Could not remove. Try again.');}
}
function exportBoard(){
var active=prayers.filter(function(p){return !p.answered;});
var done=prayers.filter(function(p){return p.answered;});
var out='BIG FAMILY PRAYER BOARD - backup made '+new Date().toLocaleDateString()+'\n\n=== PRAYING FOR ('+active.length+') ===\n\n';
active.forEach(function(p){out+='* '+p.name+'\n  '+p.text+'\n  ('+(p.added_by?p.added_by+', ':'')+fmtDate(p.created_at)+', '+p.category+')\n\n';});
if(!active.length){out+='(none)\n\n';}
out+='=== THANKSGIVING / ANSWERED ('+done.length+') ===\n\n';
done.forEach(function(p){out+='* '+p.name+'\n  '+p.text+'\n  (asked '+fmtDate(p.created_at)+(p.answered_date?', answered '+fmtDate(p.answered_date):'')+')\n\n';});
if(!done.length){out+='(none)\n';}
var ta=document.getElementById('exportText');
ta.value=out;
navigator.clipboard.writeText(out).then(function(){setStatus('exportStatus','Copied! Paste it into an email or note. The text is also shown below.');ta.style.display='block';})
.catch(function(){setStatus('exportStatus','Select and copy the text below to save it.');ta.style.display='block';ta.select();});
}
var saved=sessionStorage.getItem('keeperPass');
if(saved){PASS=saved;rpc('admin_check',{pass:saved}).then(function(r){return r.json();}).then(function(ok){if(ok===true){showAdmin();}else{sessionStorage.removeItem('keeperPass');}}).catch(function(){});}
document.getElementById('passInput').addEventListener('keydown',function(e){if(e.key==='Enter'){login();}});
</script>
</body>
</html>
